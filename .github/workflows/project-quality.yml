name: Project quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Template control integrity
        run: python3 scripts/template_self_test.py
      - name: Project-defined checks
        run: python3 scripts/run_ci.py
